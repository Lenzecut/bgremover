<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(45deg, #1e3c72, #2a5298);
        }
        .calculator {
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.2);
            width: 300px;
        }
        .display {
            width: 100%;
            height: 50px;
            font-size: 1.5rem;
            text-align: right;
            padding: 10px;
            border: none;
            outline: none;
            background: #f3f3f3;
            border-radius: 5px;
        }
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-top: 20px;
        }
        button {
            padding: 15px;
            font-size: 1.2rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }
        .operator {
            background: #ff8c00;
            color: white;
        }
        .operator:hover {
            background: #e07b00;
        }
        .equal {
            background: #28a745;
            color: white;
        }
        .equal:hover {
            background: #218838;
        }
        .clear {
            background: #dc3545;
            color: white;
        }
        .clear:hover {
            background: #c82333;
        }
        button:hover {
            opacity: 0.8;
        }
        .price-calculator {
            margin-top: 20px;
            padding: 10px;
            background: #f3f3f3;
            border-radius: 5px;
            text-align: center;
        }
        .price-calculator input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .price-calculator button {
            margin-top: 10px;
            width: 100%;
            background: #007bff;
            color: white;
        }
        .price-calculator button:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>
    <div class="calculator">
        <input type="text" id="display" class="display" disabled>
        <div class="buttons">
            <button class="clear" onclick="clearDisplay()">C</button>
            <button onclick="appendToDisplay('7')">7</button>
            <button onclick="appendToDisplay('8')">8</button>
            <button onclick="appendToDisplay('9')">9</button>
            <button class="operator" onclick="appendToDisplay('/')">/</button>
            <button onclick="appendToDisplay('4')">4</button>
            <button onclick="appendToDisplay('5')">5</button>
            <button onclick="appendToDisplay('6')">6</button>
            <button class="operator" onclick="appendToDisplay('*')">*</button>
            <button onclick="appendToDisplay('1')">1</button>
            <button onclick="appendToDisplay('2')">2</button>
            <button onclick="appendToDisplay('3')">3</button>
            <button class="operator" onclick="appendToDisplay('-')">-</button>
            <button onclick="appendToDisplay('0')">0</button>
            <button onclick="appendToDisplay('.')">.</button>
            <button class="equal" onclick="calculate()">=</button>
            <button class="operator" onclick="appendToDisplay('+')">+</button>
        </div>
        <div class="price-calculator">
            <h3>Price Calculator</h3>
            <input type="number" id="perKgPrice" placeholder="Price per kg">
            <input type="number" id="grams" placeholder="Enter grams">
            <button onclick="calculatePrice()">Calculate Price</button>
            <p id="priceResult"></p>
        </div>
    </div>
    <script>
        function appendToDisplay(value) {
            document.getElementById('display').value += value;
        }
        function clearDisplay() {
            document.getElementById('display').value = '';
        }
        function calculate() {
            try {
                document.getElementById('display').value = eval(document.getElementById('display').value);
            } catch {
                document.getElementById('display').value = 'Error';
            }
        }
        function calculatePrice() {
            const perKgPrice = parseFloat(document.getElementById('perKgPrice').value);
            const grams = parseFloat(document.getElementById('grams').value);
            if (!isNaN(perKgPrice) && !isNaN(grams)) {
                const price = (perKgPrice / 1000) * grams;
                document.getElementById('priceResult').innerText = `Price: ₹${price.toFixed(2)}`;
            } else {
                document.getElementById('priceResult').innerText = 'Please enter valid values';
            }
        }
    </script>
</body>
</html>
