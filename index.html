<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OVI BG REMOVER</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      overflow: hidden;
    }
    .container {
      text-align: center;
      background: rgba(255, 255, 255, 0.1);
      padding: 2rem;
      border-radius: 15px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(10px);
      animation: fadeIn 1s ease-in-out;
    }
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    h1 {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
      animation: slideIn 1s ease-in-out;
    }
    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateX(-50px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }
    p {
      font-size: 1.2rem;
      margin-bottom: 1.5rem;
      animation: slideIn 1.2s ease-in-out;
    }
    input[type="file"] {
      display: none;
    }
    .upload-btn {
      background: #fff;
      color: #764ba2;
      padding: 0.75rem 1.5rem;
      border-radius: 25px;
      cursor: pointer;
      font-size: 1rem;
      transition: background 0.3s ease, transform 0.3s ease;
    }
    .upload-btn:hover {
      background: #f0f0f0;
      transform: scale(1.05);
    }
    .result {
      margin-top: 2rem;
      animation: fadeIn 1.5s ease-in-out;
    }
    .result img {
      max-width: 100%;
      border-radius: 10px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
    }
    .loading {
      display: none;
      margin-top: 1rem;
      font-size: 1.2rem;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% {
        opacity: 0.6;
      }
      50% {
        opacity: 1;
      }
      100% {
        opacity: 0.6;
      }
    }
    .download-btn {
      display: none;
      background: #4CAF50;
      color: #fff;
      padding: 0.75rem 1.5rem;
      border-radius: 25px;
      cursor: pointer;
      font-size: 1rem;
      margin-top: 1rem;
      transition: background 0.3s ease, transform 0.3s ease;
    }
    .download-btn:hover {
      background: #45a049;
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Remove Background In No Time</h1>
    <p>Upload your photo to remove the background instantly!</p>
    <label for="file-upload" class="upload-btn">Choose Photo</label>
    <input type="file" id="file-upload" accept="image/*">
    <div class="loading" id="loading">Processing...</div>
    <div class="result" id="result"></div>
    <button class="download-btn" id="download-btn">Download Image</button>
  </div>

  <script>
    const fileUpload = document.getElementById('file-upload');
    const resultDiv = document.getElementById('result');
    const loadingDiv = document.getElementById('loading');
    const downloadBtn = document.getElementById('download-btn');

    fileUpload.addEventListener('change', async (event) => {
      const file = event.target.files[0];
      if (file) {
        loadingDiv.style.display = 'block';
        resultDiv.innerHTML = '';
        downloadBtn.style.display = 'none';

        const formData = new FormData();
        formData.append('image_file', file);

        try {
          const response = await fetch('https://api.remove.bg/v1.0/removebg', {
            method: 'POST',
            headers: {
              'X-Api-Key': '33da3JsR58n3HRgAh26as7e9',
            },
            body: formData,
          });

          if (!response.ok) {
            throw new Error('Failed to remove background');
          }

          const blob = await response.blob();
          const imageUrl = URL.createObjectURL(blob);
          resultDiv.innerHTML = `<img src="${imageUrl}" alt="Background Removed">`;
          downloadBtn.style.display = 'block';

          // Set up download button
          downloadBtn.onclick = () => {
            const link = document.createElement('a');
            link.href = imageUrl;
            link.download = 'background-removed.png';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
          };
        } catch (error) {
          resultDiv.innerHTML = `<p style="color: #ff4d4d;">Error: ${error.message}</p>`;
        } finally {
          loadingDiv.style.display = 'none';
        }
      }
    });
  </script>
</body>
</html>
